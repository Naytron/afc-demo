name: e2e

on:
  pull_request:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'
      - name: Set up Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 24
          cache: npm
      - name: Azure login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build PWA for dev API
        id: api
        run: |
          api_url="$(az containerapp show --name afc-api-dev --resource-group rg-afc-dev \
            --query 'properties.configuration.ingress.fqdn' --output tsv)"
          echo "url=https://$api_url" >> "$GITHUB_OUTPUT"
          printf '{\n  "ApiBaseUrl": "https://%s/"\n}\n' "$api_url" > src/afc-web/wwwroot/appsettings.Production.json
          dotnet publish src/afc-web/Afc.Web.csproj --configuration Release --output ./artifacts/web
      - name: Read preview deployment token
        run: |
          token="$(az staticwebapp secrets list --name afc-web-dev --resource-group rg-afc-dev \
            --query properties.apiKey --output tsv)"
          echo "::add-mask::$token"
          echo "azure_static_web_apps_api_token=$token" >> "$GITHUB_ENV"
      - name: Deploy preview
        id: deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          action: upload
          app_location: artifacts/web/wwwroot
          skip_app_build: true
          azure_static_web_apps_api_token: ${{ env.azure_static_web_apps_api_token }}
          deployment_environment: preview-${{ github.event.pull_request.number || 'nightly' }}
      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Smoke test preview
        run: ./scripts/smoke.sh "${{ steps.deploy.outputs.static_web_app_url }}" "${{ steps.api.outputs.url }}"
      - name: Run Playwright against preview
        env:
          BASE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: playwright-report
          path: playwright-report
